# Static dashboard. Without Binance keys the app runs in DEMO mode.
# NETLIFY_NEXT_PLUGIN_SKIP keeps Netlify from treating this export as a server app.
[build]
  base = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_STATIC_EXPORT = "1"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
